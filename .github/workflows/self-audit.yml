name: Mossy 4X self-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 1"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "config/**"
      - "tests/**"
      - "render.yaml"
      - "requirements.txt"
      - ".github/workflows/self-audit.yml"

permissions:
  contents: read

concurrency:
  group: mossy-4x-self-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app src

      - name: Run test suite
        run: pytest -q

      - name: Audit Render safety configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("render.yaml").read_text(encoding="utf-8")
          required = {
              'startCommand: "python -m src.main"': "correct Render start command",
              "value: demo": "demo mode",
              "value: practice": "OANDA practice environment",
              'value: "AUD_USD,GBP_USD"': "protected instrument list",
              'key: ALLOW_HIGH_RISK': "high-risk guard",
              'value: "false"': "disabled unsafe toggles",
              'key: SHADOW_AUTO_APPLY': "shadow auto-apply guard",
              'key: MAX_TRADES_PER_DAY': "daily trade cap",
              'value: "8"': "eight-trade daily limit",
          }
          missing = [label for token, label in required.items() if token not in text]
          if missing:
              raise SystemExit("Render safety audit failed: " + ", ".join(missing))
          print("Render safety configuration audit passed")
          PY

      - name: Confirm live-mode hard block remains
        run: |
          python - <<'PY'
          from pathlib import Path

          broker = Path("app/broker.py").read_text(encoding="utf-8")
          main = Path("src/main.py").read_text(encoding="utf-8")
          if "Live trading is disabled" not in broker and "Live mode is disabled" not in main:
              raise SystemExit("Live-mode hard block was not found")
          print("Live-mode hard block confirmed")
          PY
