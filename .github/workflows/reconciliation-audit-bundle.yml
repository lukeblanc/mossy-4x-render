name: Reconciliation audit bundle
on:
  pull_request:
    paths:
      - '.github/workflows/reconciliation-audit-bundle.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package tracked source and offline dependencies
        run: |
          mkdir -p /tmp/mossy-accounting-audit
          git archive --format=zip -o /tmp/mossy-accounting-audit/source.zip HEAD
          python -m pip download --only-binary=:all: -r requirements.txt -d /tmp/mossy-accounting-audit/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: mossy-accounting-audit
          path: /tmp/mossy-accounting-audit
          retention-days: 1
          if-no-files-found: error
