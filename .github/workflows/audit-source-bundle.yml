name: Audit source bundle
on:
  pull_request:
    paths:
      - '.github/workflows/audit-source-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package tracked source only for offline audit
        run: git archive --format=zip -o /tmp/mossy-source.zip HEAD
      - name: Download runtime wheels for offline tests
        run: |
          python -m pip download --only-binary=:all: -r requirements.txt -d /tmp/mossy-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: mossy-audit-source
          path: /tmp/mossy-source.zip
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mossy-audit-wheels
          path: /tmp/mossy-wheels
          retention-days: 1
          if-no-files-found: error
